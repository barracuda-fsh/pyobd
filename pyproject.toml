[project]
dependencies = [
    "wxPython>=4.2.1,<5",
    "numpy>=1.23",
    "Pint>=0.20.1",
    "pyserial>=3.5,<4",
]

name = "pyobd2"
version = "1.17"
description = "An OBD-II compliant car diagnostic tool "
authors = [{ "name" = "Jure Poljsak" }, { "name" = "Charles Donour Sizemore" }]
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.8"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
